[package]
name = "rmycli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A Redis shell with live command help and type-aware completion"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/michael-grunder/rmycli"
repository = "https://github.com/michael-grunder/rmycli"
keywords = ["redis", "cli", "repl", "completion"]
categories = ["command-line-utilities", "database"]
include = [
    "/src/",
    "/data/",
    "/tests/",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
    "/rmycli.dist.toml",
    "/rustfmt.toml",
    "/AGENTS.md",
]

[dependencies]
alkali = { version = "0.3", default-features = false, features = ["std", "minimal"] }
zeroize = { version = "1.9", features = ["serde"] }
rustix = { version = "1.1", features = ["fs", "process"] }
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["serde"] }
redis = { version = "1.8.1", features = [
    "tls-rustls", "tls-rustls-insecure", "tokio-rustls-comp",
] }
# redis-rs leaves the TLS crypto provider to the application.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = "0.25"
tempfile = "3.27"
unicode-width = "0.2"
xdg = "3.0"

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
combine = "4.6"
rustls-native-certs = "0.8"
