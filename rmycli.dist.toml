# rmycli configuration reference
#
# Copy this file to ~/.config/rmycli.toml, or to
# $XDG_CONFIG_HOME/rmycli.toml if you use a custom XDG config directory.
# This .dist.toml file is not loaded automatically. To use it explicitly:
#   rmycli --config ./rmycli.dist.toml
#
# The first available config file wins; files are not merged. User config
# takes precedence over rmycli.toml in $XDG_CONFIG_DIRS (default: /etc/xdg).
# --config PATH selects one file; --no-config uses built-in defaults.
# Settings are read at startup. Restart an open shell after editing.
#
# All settings are optional. Unknown fields and invalid values are errors.
# Uncomment examples as needed; do not define the same setting twice.
# Protocol, cluster, history, prompt, size hints, theme, instance, and auth
# settings live here. Timeouts, completion/scan limits, reply confirmation
# thresholds, --raw, and --yes remain command-line options. See rmycli --help.
#
# Read or edit settings without connecting to Redis:
#   rmycli config get theme.inline-hint
#   rmycli config set theme.inline-hint cyan
#   rmycli config unset theme.inline-hint
# Color reads and updates include a colored sample in terminals.
# --color always forces previews; --color never suppresses them.
# Automatic previews respect NO_COLOR and are omitted from piped output.

# Protocol version for the main connection: 2 (default) or 3 (HELLO 3).
# Instances inherit this value unless they set their own resp integer.
# -2/-3 override configuration; --json/--quoted-json select RESP3 unless -2.
# Auxiliary connections use RESP2 independently.
#   rmycli config set resp 3
resp = 2

# Detect cluster mode after connecting and follow MOVED/ASK redirects.
# false disables automatic detection; -c still explicitly enables redirects.
# Valkey standalone CLIENT CAPA REDIRECT support is independent of this setting.
#   rmycli config set auto-cluster false
auto-cluster = true

# Recall only the initial connection endpoint's history (default: true).
# false shows all servers' entries in Up/Down and Ctrl-R, in saved order.
# Entries still retain their server tags in the shared rmycli_history file.
#   rmycli config set history-per-server false
history-per-server = true

# Show live reply-size hints while typing, e.g. [3 members] (default: true).
# false also disables their background probes. Execution confirmation is
# controlled separately by --reply-threshold and --yes.
size-hints = true

# Use theme.size-hint-warning at or above this count (default: 10000).
# Counts use the displayed unit: members, fields, elements, or bytes for GET.
# Upper bounds (marked ≤) use the same threshold. Zero warns on every count.
# Must be a nonnegative integer.
size-hint-threshold = 10000

# Encrypt saved credentials in ~/.config/rmycli/auth.enc (under XDG_CONFIG_HOME).
# Prompts for a master passphrase when needed; requires terminal stdin.
# Existing encrypted files are detected even when this is false.
# Migrate an existing plaintext auth file with: rmycli auth encrypt
# Migration retains the original file and warns you to delete it after testing.
# Change the master passphrase with: rmycli auth passwd
# In the shell: \auth lock, \auth unlock, \auth passwd.
# This setting does not enable saving or encrypt passwords in [instances].
encrypt-auth = false

# Automatic credential saving, after successful authentication only.
# false (default): never save automatically; still read manually saved entries.
# "local": save for localhost, loopback IP addresses, and Unix sockets.
# "always": save for every server. Plaintext unless encrypt-auth is enabled.
# The file is $XDG_CONFIG_HOME/rmycli-auth.toml (normally
# ~/.config/rmycli-auth.toml); --no-config disables reading and writing it.
# Use [servers."redis://127.0.0.1:7000"] with password and optional user in
# that separate file, or [servers."redis://127.0.0.1:7000".users] with
# alice = "password" and bob = "another-password" for multiple ACL accounts.
# Without --user or a saved default, select the first username alphabetically.
# Use --set-default-user USER to save a default (default for password-only).
# See README.md for defaults, TLS, IPv6, and socket examples.
# Automatic writes use owner-only permissions on Unix.
#   rmycli config set save-auth local
save-auth = false

# ---------------------------------------------------------------------------
# Interactive prompt
# ---------------------------------------------------------------------------
# A single-line template, with readable {name} placeholders. This is a top-level
# setting: keep it ABOVE [theme] and all other table headings. The default shows
# a cyan user and endpoint, an optional database suffix, and a green Unicode ❯:
#
#   default@127.0.0.1:6379 ❯
#   alice@redis.example.com:6380[2] ❯
#
# No special icon font is needed, but your terminal/font must support Unicode.
# Spaces are literal; keep a trailing space to separate the prompt from input.
# Omit this setting (or `rmycli config unset prompt`) to use the built-in default.
prompt = "{color:cyan}{user}@{address}{database}{reset} {color:green}{ctrl}❯{reset} "
#
# Connection placeholders (names are case sensitive):
#   {user}       Session username, or "default" when none was supplied.
#   {address}    Host:port as displayed by the connection, or Unix socket path.
#   {host}       Host alone, or Unix socket path for Unix connections.
#   {port}       TCP/TLS port; empty for Unix connections.
#   {db}         Current database number, INCLUDING zero: 0, 1, 2, ...
#   {database}   Optional bracketed suffix: empty for db 0, otherwise [1], [2]...
#   {transport}  "redis" for TCP, "rediss" for TLS, or "unix" for sockets.
#   {ctrl}       "[Ctrl]" while Ctrl is held, otherwise empty. Requires terminal
#                modifier events; omit it to hide the indicator. It does not
#                change Ctrl+Enter behavior. Command echoes omit the indicator.
#
# Values follow the active connection after successful AUTH, HELLO AUTH,
# SELECT, RESET, reconnects, and redirects. There are no password/URL fields.
# Connection values are inserted once, never interpreted as template syntax,
# and terminal control characters in values are escaped before display.
#
# Foreground colors:
#   {color:cyan}          Named terminal color (all names listed below).
#   {color:#89b4fa}       RGB hex: exactly six hexadecimal digits.
#   {color:rgb_(137,180,250)}  RGB decimal: each component from 0 through 255.
#   {color:ansi_(117)}    Terminal palette index from 0 through 255.
#   {reset}              Restore the terminal's default foreground color.
#   {color:reset}        Same as {reset}.
#
# A color applies to following text/placeholders until another color or reset.
# Styles automatically end before typed input; {reset} is still useful between
# segments. Colors do not count toward cursor positions or scrolling width.
# Named colors use your terminal palette; RGB colors need truecolor support.
# Set NO_COLOR to a nonempty value to suppress colors (Unicode is unchanged).
# Prompt styling applies to the live editor. Submitted commands and exit echoes
# use the same expanded text without prompt colors. Ctrl-R keeps its dedicated
# "history> " prompt. Batch commands and piped input do not display a prompt.
#
# Copy ONE of these recipes over the active prompt assignment above:
#
# Plain ASCII, matching the older prompt (no explicit colors):
# prompt = "{user}@{address}{database}{ctrl}> "
#
# Minimal Unicode prompt, without connection details:
# prompt = "{color:green}{ctrl}❯{reset} "
#
# Always show the database and transport, including database zero:
# prompt = "{color:cyan}{transport} {address}{reset} db={db} {ctrl}❯ "
#
# Distinct colors for the user, address, and prompt marker:
# prompt = "{color:magenta}{user}{reset}@{color:#89b4fa}{address}{database}{reset} {color:green}{ctrl}❯{reset} "
#
# Literal braces: {{ produces { and }} produces }. For example:
# prompt = "{{redis}} {address}{database} {ctrl}> "
#
# Manage the template without connecting to Redis (quotes here are shell quotes;
# `config set` adds the TOML quoting for you). Restart open shells after changes:
#   rmycli config get prompt
#   rmycli config set prompt '{color:cyan}{address}{reset} {ctrl}❯ '
#   rmycli config unset prompt
# `config get` prints the template itself, not a connected-session preview.
#
# Unknown placeholders/colors, unmatched braces, newlines, tabs, and raw ANSI
# escapes are configuration errors detected before connecting. Empty templates
# are allowed and hide the prompt entirely. Templates do not execute shell
# commands or expand environment variables. Conditional expressions, background
# colors, text attributes, multiline prompts, and theme packs are not supported.

[theme]
# Foreground color of inline argument hints. Default: "dark_grey".
# This does not change typed input, command output, or completion popup colors.
inline-hint = "dark_grey"

# Foreground colors of live reply-size hints, separate from argument hints.
# At or above size-hint-threshold, use size-hint-warning instead.
size-hint = "dark_cyan"
size-hint-warning = "red"

# Supported color strings:
#   "black", "red", "green", "yellow", "blue", "magenta", "cyan", "white",
#   "grey", "dark_grey", "dark_red", "dark_green", "dark_yellow", "dark_blue",
#   "dark_magenta", "dark_cyan"
#   "reset"           -- terminal's default foreground color
#   "#89b4fa"         -- RGB hex, exactly six hexadecimal digits
#   "rgb_(137,180,250)" -- RGB decimal components, each 0 through 255
#   "ansi_(117)"      -- terminal palette index, 0 through 255
# Named colors follow your terminal palette. RGB needs terminal support.

[theme.commands]
# Optional per-command inline-hint colors; no overrides are built in.
# Names are case insensitive, and whitespace is normalized. Quote command
# names containing spaces or dots. Duplicate normalized names are errors.
# Specific subcommand > parent command > theme.inline-hint.
# Module command names are allowed even when the current server lacks them.
#
# GET = "cyan"
# LRANGE = "#89b4fa"
# XGROUP = "green"
# "XGROUP CREATE" = "yellow"
# "JSON.GET" = "ansi_(117)"
#
# CLI equivalent (outer quotes are shell quoting):
#   rmycli config set 'theme.commands."XGROUP CREATE"' yellow

[instances.local]
# Named instances are opt-in: rmycli --instance local
# You can also run a command: rmycli --instance local PING
# Names are case sensitive. Host/port alone never select an instance.
# All fields below are optional; these four values show built-in defaults.
host = "127.0.0.1" # Nonempty hostname or IP address.
port = 6379        # Integer from 1 through 65535.
db = 0             # Nonnegative database number.
tls = false        # true enables TLS with certificate verification.

# Omit to inherit the global resp setting; use 2 or 3 to override it.
# resp = 3
#   rmycli config set instances.local.resp 3
#   rmycli config unset instances.local.resp

# Redis ACL username. Omit for the default user/password-only authentication.
# user = "alice"

# Choose at most ONE password source. Neither is configured by default.
# password-env names an environment variable, read when selecting the instance.
# A missing variable is an error unless an overriding password is supplied.
# password-env = "LOCAL_REDIS_PASSWORD"
#
# Alternatively, store a literal password. It is not interpolated.
# Protect config files containing passwords with owner-only permissions.
# password = "replace-with-your-password"
#
# Authentication applies to command and background assistance connections.
# Explicit -h, -p, -n, --user, and -a override instance fields.
# Password precedence: -a > REDISCLI_AUTH > instance password/password-env.
# --tls can enable TLS for an instance. --instance cannot be combined with
# -u/REDIS_URL or -s; unset REDIS_URL before selecting a named instance.
#
# CLI examples:
#   rmycli config set instances.local.password-env LOCAL_REDIS_PASSWORD
#   rmycli config get instances.local.host
# Password updates print [redacted]; an explicit get of a stored password
# prints the password. Reading password-env prints the variable's name.

# A second instance, with TLS and authentication (customize before enabling).
# Set QA_REDIS_PASSWORD in your environment, then use rmycli --instance qa.
# [instances.qa]
# host = "redis.qa.example.com"
# port = 6380
# db = 2
# tls = true
# user = "alice"
# password-env = "QA_REDIS_PASSWORD"
#
# Quote instance names containing dots: [instances."qa.eu"]
# CLI equivalent: rmycli config set 'instances."qa.eu".host' qa.example.com
